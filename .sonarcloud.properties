# SonarCloud reads this file because the project uses Automatic Analysis
# (sonar.autoscan.enabled=true). A sonar-project.properties file is read only by
# a CI-run scanner, and this repository runs none.
#
# perceivo_client/generated/ is written by a pinned code generator
# (datamodel-code-generator, driven by openapi/regen.py) from the vendored
# OpenAPI document. It must not be edited by hand: `python openapi/regen.py
# --check` regenerates it and fails CI on any byte of drift. Sonar issues raised
# on it (for example python:S1192, duplicated string literals in field
# descriptions) can only be fixed upstream in the spec or the generator, so the
# tree is excluded from analysis, as it is already omitted from coverage
# ([tool.coverage.run] omit in pyproject.toml).
sonar.exclusions=perceivo_client/generated/**
