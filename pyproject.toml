[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perceivo-client"
version = "1.0.0"
description = "Public REST client SDK for the Perceivo Platform API (/v1)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "ConceptBuilder AI", email = "support@perceivo.ai"}
]
keywords = ["ai", "orchestration", "agents", "llm", "api", "client", "rest", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "typing-extensions>=4.12.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff==0.17.0",
    "build>=1.0",
    "pyyaml>=6.0",
]
# Exact pins: these versions reproduce perceivo_client/generated/models/.
codegen = [
    "datamodel-code-generator[http]==0.83.0",
    "black==26.5.1",
    "isort==9.0.2",
]

[project.urls]
Homepage = "https://perceivo.ai"
Documentation = "https://perceivo.ai/docs"
Source = "https://github.com/ConceptBuilderAI/perceivo-client"
Issues = "https://github.com/ConceptBuilderAI/perceivo-client/issues"
Changelog = "https://github.com/ConceptBuilderAI/perceivo-client/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["perceivo_client*"]

[tool.setuptools.package-data]
perceivo_client = ["py.typed", "generated/*.py"]
"perceivo_client.signing" = ["vectors/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
extend-ignore = [
    "B008",
    "B904",
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "UP045",
    "UP035",
]

[tool.ruff.lint.per-file-ignores]
"perceivo_client/generated/*" = ["ALL"]
"perceivo_client/**/__init__.py" = ["F401"]

[tool.ruff.format]
exclude = ["perceivo_client/generated/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source_pkgs = ["perceivo_client"]
branch = true
relative_files = true
omit = ["*/generated/*"]
