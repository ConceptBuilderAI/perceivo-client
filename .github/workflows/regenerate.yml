# Regenerates perceivo_client/generated/models/ from the vendored spec and
# uploads the result as a patch artifact. It cannot write to the repository.
#
# Usage:
#   gh workflow run regenerate.yml --ref <your work branch> -f branch=<your work branch>
#   gh run download <run id> -n regenerated-models -D "$TMPDIR/regen"
#   git apply --index "$TMPDIR/regen/models.patch"
# The ref and the branch input must match. No artifact is uploaded when the
# committed models are already current.
name: Regenerate models

run-name: Regenerate models on ${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Existing work branch to regenerate and commit to (never dev, main or release/*)"
        required: true
        type: string

permissions: {}

concurrency:
  group: client-regenerate-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  guard:
    name: Refuse a protected target branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the target branch
        env:
          REGEN_BRANCH: ${{ inputs.branch }}
          REGEN_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REGEN_REF: ${{ github.ref }}
        run: python3 .github/scripts/regen_dispatch_guard.py

  regenerate:
    name: Regenerate from the vendored spec
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      head: ${{ steps.diff.outputs.head }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      # Checks out the dispatched commit, which the guard has matched to the branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"
      - name: Install the hash-locked codegen toolchain
        run: >-
          python -m pip install --only-binary :all: --require-hashes
          -r .github/requirements-codegen.txt
      - name: Regenerate, then prove the tree equals the generator output
        run: |
          python openapi/regen.py
          python openapi/regen.py --check
      - name: Stage the models and refuse any other change
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git add --all -- perceivo_client/generated/models
          other=$(git status --porcelain --untracked-files=all -- . ':(exclude)perceivo_client/generated/models')
          if [ -n "$other" ]; then
            echo "::error::regeneration changed files outside perceivo_client/generated/models/:"
            echo "$other"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/regen"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The committed models already equal the generator output; nothing to commit."
          else
            git diff --cached --binary --no-renames > "$RUNNER_TEMP/regen/models.patch"
            git diff --cached --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: regenerated-models
          path: ${{ runner.temp }}/regen/models.patch
          if-no-files-found: error
          retention-days: 1

